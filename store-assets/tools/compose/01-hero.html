<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>01 hero</title>
<link rel="stylesheet" href="common.css">
<style>
  .canvas.hero {
    background:
      radial-gradient(760px 520px at 86% -6%, rgba(96, 165, 250, 0.55), transparent 70%),
      radial-gradient(640px 460px at -4% 108%, rgba(23, 37, 84, 0.65), transparent 70%),
      linear-gradient(135deg, #2563eb 0%, #1d4ed8 48%, #1e3a8a 100%);
  }
  .deco-ring {
    position: absolute; border-radius: 50%;
    border: 36px solid rgba(255, 255, 255, 0.07);
  }
  /* the lockup stays clearly below the headline (60px): icon 64 / name 34 / kind 15 */
  .hero .lockup {
    position: absolute; left: 72px; top: 56px;
    display: flex; align-items: center; gap: 16px;
  }
  .hero .lockup img {
    width: 64px; height: 64px; display: block;
    filter: drop-shadow(0 8px 14px rgba(15, 23, 42, 0.35));
  }
  .hero .lockup .name {
    font-size: 34px; line-height: 1.2; font-weight: 800; color: #fff; letter-spacing: 0.05em;
  }
  .hero .lockup .kind {
    font-size: 15px; line-height: 1.3; font-weight: 600; color: rgba(255, 255, 255, 0.78);
    letter-spacing: 0.06em; margin-top: 2px;
  }
  .hero .copy { top: 168px; width: 500px; }
  .hero .headline { margin: 0; font-size: 60px; line-height: 1.28; color: #fff; }
  .hero .headline .accent { color: var(--amber-400); }
  .hero .sub { margin-top: 22px; color: rgba(255, 255, 255, 0.9); }

  .popup-fig { left: 848px; top: 42px; }
  .popup-fig img {
    width: 320px; border-radius: 16px;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.35), 0 24px 56px rgba(15, 23, 42, 0.45);
  }

  .site-card { top: 530px; width: 548px; height: 158px; padding: 18px 18px 0; }
  .site-card.gf { left: 72px; }
  .site-card.wt { left: 660px; }
  .site-card .hd {
    display: flex; align-items: center; gap: 10px; height: 28px;
    font-size: 19px; font-weight: 800; color: var(--ink); letter-spacing: 0.02em;
  }
  .site-card .hd .dot { width: 10px; height: 10px; border-radius: 3px; background: var(--blue-600); }
  .site-card .hd .item { color: var(--ink-2); font-weight: 700; }
  .site-card .body { position: relative; height: 80px; margin-top: 14px; }
  .site-card .shot { left: 0; }
  .site-card.gf .shot { top: 13px; }
  .site-card.gf .shot img { width: 512px; border-radius: 10px; }
  .site-card.wt .shot { top: 0; }
  .site-card.wt .shot img { width: 512px; }

  .hero .footnote { color: rgba(255, 255, 255, 0.96); }   /* >= 7:1 on the blue */
</style>
</head>
<body>
<div class="canvas hero">
  <div class="deco-ring" style="left: 760px; top: -260px; width: 620px; height: 620px;"></div>
  <div class="deco-ring" style="left: -180px; top: 560px; width: 420px; height: 420px; border-width: 28px;"></div>

  <div class="lockup" data-block="lockup">
    <img src="build/icon128.png" alt="">
    <div>
      <div class="name l">ギガひろ</div>
      <div class="kind l">Chrome 拡張機能</div>
    </div>
  </div>

  <div class="copy" data-col="480" data-block="copy">
    <h1 class="headline">
      <span class="l">開くだけで、</span>
      <span class="l accent">いつもの日数に</span>
    </h1>
    <p class="sub">
      <span class="l">ギガファイル便の保持期限と</span>
      <span class="l">ギガワタスの共有期限を自動選択</span>
    </p>
  </div>

  <figure class="shot popup-fig" data-geom="popup_saved" data-block="popup">
    <img src="build/popup_saved.png" alt="">
  </figure>

  <div class="card site-card gf" data-block="card-gf">
    <div class="hd"><span class="dot"></span><span class="l">ギガファイル便<span class="item">：保持期限</span></span></div>
    <div class="body">
      <figure class="shot" data-geom="gf_bar_after">
        <img src="build/gf_bar_after.png" alt="">
        <div class="ring" data-box="cell" data-pad="3" style="border-width:3px;border-radius:8px"></div>
      </figure>
    </div>
  </div>

  <div class="card site-card wt" data-block="card-wt">
    <div class="hd"><span class="dot"></span><span class="l">ギガワタス<span class="item">：共有期限</span></span></div>
    <div class="body">
      <figure class="shot" data-geom="wt_days_after">
        <img src="build/wt_days_after.png" alt="">
        <div class="ring" data-box="cell" data-pad="3" style="border-width:3px;border-radius:12px"></div>
      </figure>
    </div>
  </div>

  <div class="footnote" data-block="footnote">※非公式ツールです。ギガファイル便・ギガワタスの運営会社とは関係ありません。</div>
</div>
<script src="build/geometry.js"></script>
<script>
  window.layout = function (H) {
    const pop = H.rectOf(document.querySelector(".popup-fig img"));
    const gf = H.rectOf(document.querySelector(".site-card.gf"));
    const wt = H.rectOf(document.querySelector(".site-card.wt"));
    // land each arrow on the measured centre of the ring around the selected day
    const gR = H.rectOf(document.querySelector(".site-card.gf .ring"));
    const wR = H.rectOf(document.querySelector(".site-card.wt .ring"));
    const color = "#f59e0b";                      // amber-500, same as the rings
    const o = { color, width: 4, size: 16 };
    // ギガワタス: straight down from the popup (the ring centre lies under the popup)
    if (wR.cx < pop.x + 24 || wR.cx > pop.r - 24) H.issues.push("30日 ring is not under the popup");
    const sB = { x: wR.cx, y: pop.b + 12 }, tB = { x: wR.cx, y: wt.y - 10 };
    const aB = H.lineArrow(sB, tB, o);
    H.dot(sB.x, sB.y, 6, color);
    // self-check: the ギガワタス head points straight down (90deg +-5) and the shaft is vertical
    if (Math.abs(H.deg(aB.ang) - 90) > 5) H.issues.push(`giga-watasu arrow head is not pointing down: ${H.deg(aB.ang).toFixed(1)}deg`);
    if (Math.abs(aB.end.x - sB.x) > 0.5) H.issues.push(`giga-watasu arrow shaft is slanted: dx=${(aB.end.x - sB.x).toFixed(1)}px`);
    if (Math.abs(tB.x - wR.cx) > 0.5) H.issues.push("giga-watasu arrow does not land on the 30-day ring centre");
    // ギガファイル便: one arc from the popup's lower-left corner down to the 14日 ring
    const sA = { x: pop.x + 40, y: pop.b + 12 }, tA = { x: gR.cx, y: gf.y - 10 };
    const aA = H.curveArrow(sA, { x: sA.x, y: sA.y + 60 }, { x: tA.x + 80, y: tA.y - 70 }, tA, o);
    H.dot(sA.x, sA.y, 6, color);
    // self-check: the ギガファイル便 head points down into the card (between down-right and down-left)
    if (H.deg(aA.ang) < 30 || H.deg(aA.ang) > 150) H.issues.push(`gigafile arrow head does not point down: ${H.deg(aA.ang).toFixed(1)}deg`);
    if (Math.abs(tA.x - gR.cx) > 0.5) H.issues.push("gigafile arrow does not land on the 14-day ring centre");
    H.issues.push(`note: arrow heads giga-watasu ${H.deg(aB.ang).toFixed(1)}deg, gigafile ${H.deg(aA.ang).toFixed(1)}deg`);
    // the arc must stay clear of the sub-headline
    const sub = document.querySelector(".hero .sub");
    const r = document.createRange(); r.selectNodeContents(sub);
    const sr = H.rectOf({ getBoundingClientRect: () => r.getBoundingClientRect() });
    for (let i = 0; i <= 40; i++) {
      const t = i / 40, u = 1 - t;
      const c0 = { x: sA.x, y: sA.y + 60 }, c1 = { x: tA.x + 80, y: tA.y - 70 };
      const x = u * u * u * sA.x + 3 * u * u * t * c0.x + 3 * u * t * t * c1.x + t * t * t * tA.x;
      const y = u * u * u * sA.y + 3 * u * u * t * c0.y + 3 * u * t * t * c1.y + t * t * t * tA.y;
      if (x > sr.x - 8 && x < sr.r + 8 && y > sr.y - 8 && y < sr.b + 8) { H.issues.push("arrow touches the sub-headline"); break; }
    }
  };
</script>
<script src="common.js"></script>
</body>
</html>
