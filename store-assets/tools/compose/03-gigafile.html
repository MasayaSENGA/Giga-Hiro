<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>03 gigafile</title>
<link rel="stylesheet" href="common.css">
<style>
  /* right: the site's upload panel (retention bar + the first three lines of the drop area) */
  .panel-fig { left: 624px; top: 0; }
  .panel-fig img {
    width: 608px;
    border-radius: 14px;
    box-shadow: 0 2px 4px rgba(15, 23, 42, 0.10), 0 28px 56px rgba(30, 58, 138, 0.28);
  }
  /* left: the site default without the extension, for comparison */
  .compare { margin-top: 40px; width: 448px; }
  .compare .lab {
    display: flex; align-items: center; gap: 10px; height: 30px;
    font-size: 18px; font-weight: 700; color: var(--ink-2); font-feature-settings: "palt";
  }
  .compare .k { font-weight: 800; }
  .compare .k.off { color: var(--ink-3); }
  .compare .shot { position: relative; margin-top: 8px; }
  .compare .shot img { width: 448px; border-radius: 8px; }
</style>
</head>
<body>
<div class="canvas">
  <div class="stage"></div>

  <div class="brand" data-block="brand"><img src="build/icon128.png" alt=""><span class="name">ギガひろ</span></div>

  <div class="copy" data-col="520" data-block="copy">
    <div class="eyebrow">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4"/><path d="M7.5 8.5 12 4l4.5 4.5"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
      <span class="l">ギガファイル便</span>
    </div>
    <h1 class="headline">
      <span class="l">ギガファイル便は</span>
      <span class="l">開けば<span class="mark">選択済み</span></span>
    </h1>
    <p class="sub">
      <span class="l">画面を開くと、設定した</span>
      <span class="l">保持期限が選ばれた状態に</span>
    </p>

    <div class="compare">
      <div class="before">
        <div class="lab"><span class="l"><span class="k off">拡張なし</span>：サイト既定の5日</span></div>
        <figure class="shot" data-geom="gf_bar_before"><img src="build/gf_bar_before.png" alt=""></figure>
      </div>
    </div>
  </div>

  <figure class="shot panel-fig" data-geom="gf_panel_after" data-block="panel">
    <img src="build/gf_panel_after.png" alt="">
    <div class="ring" data-box="cell" data-pad="5" style="border-radius:9px"></div>
  </figure>

  <div class="chip" data-block="chip">
    <svg viewBox="0 0 24 24"><path d="M13.5 2 5 13.5h6L9.8 22 19 10h-6.2L13.5 2Z" fill="#fbbf24"/></svg>
    <span class="l">ギガひろが自動で選択</span>
  </div>

  <div class="fig-cap" data-block="caption">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg>
    <span class="l">ギガひろで保持期限を14日に設定した場合</span>
  </div>

  <div class="footnote" data-block="footnote">※非公式ツールです。ギガファイル便・ギガワタスの運営会社とは関係ありません。</div>
</div>
<script src="build/geometry.js"></script>
<script>
  window.layout = function (H) {
    const stage = H.rectOf(document.querySelector(".stage"));
    const fig = document.querySelector(".panel-fig");
    const chip = document.querySelector(".chip");
    const cap = document.querySelector(".fig-cap");
    const ringOut = 5 + 4;                       // ring pad + ring border
    const wire = 30;                             // chip bottom -> ring top
    const capGap = 22;
    // chip + wire + panel + caption as one group, centred in the stage
    const cellTop = H.boxRect(fig, "cell").y - H.rectOf(fig).y;   // cell top inside the figure
    const above = chip.offsetHeight + wire + ringOut - cellTop;   // group height above the panel
    const groupH = above + fig.offsetHeight + capGap + cap.offsetHeight;
    const top = stage.y + (stage.h - groupH) / 2;
    fig.style.top = (top + above) + "px";
    const cell = H.boxRect(fig, "cell");
    const ringTop = cell.y - ringOut;
    chip.style.left = (cell.cx - chip.offsetWidth / 2) + "px";
    chip.style.top = (ringTop - wire - chip.offsetHeight) + "px";
    H.path(`M ${cell.cx} ${ringTop - wire} V ${ringTop - 2}`, { color: "#f59e0b", width: 3 });
    H.dot(cell.cx, ringTop - 2, 4.5);
    const fr = H.rectOf(fig.querySelector("img"));
    cap.style.left = fr.x + "px";
    cap.style.top = (fr.b + capGap) + "px";
  };
</script>
<script src="common.js"></script>
</body>
</html>
