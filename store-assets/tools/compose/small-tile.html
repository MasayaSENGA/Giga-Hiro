<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>small promo tile</title>
<link rel="stylesheet" href="common.css">
<style>
  html, body { background: #1d4ed8; }
  .canvas.tile {
    width: 440px; height: 280px;
    background:
      radial-gradient(300px 220px at 80% 0%, rgba(96, 165, 250, 0.40), transparent 70%),
      radial-gradient(260px 200px at 100% 100%, rgba(23, 37, 84, 0.55), transparent 70%),
      linear-gradient(135deg, #2563eb 0%, #1d4ed8 55%, #1e40af 100%);
  }
  .tile .deco {
    position: absolute; right: -70px; bottom: -110px; width: 260px; height: 260px;
    border-radius: 50%; border: 26px solid rgba(255, 255, 255, 0.08);
  }
  .tile .deco2 {
    position: absolute; left: -60px; top: -80px; width: 170px; height: 170px;
    border-radius: 50%; border: 18px solid rgba(255, 255, 255, 0.07);
  }
  .tile .lockup {
    position: absolute; left: 0; top: 0; width: 440px; height: 280px;
    display: flex; align-items: center; justify-content: center; gap: 18px;
  }
  .tile .icon { position: relative; width: 112px; height: 112px; flex: none; }
  /* thin light rim so the icon's rounded square does not melt into the blue */
  .tile .icon::before {
    content: ""; position: absolute; inset: -3px; border-radius: 29px;
    background: rgba(255, 255, 255, 0.18);
  }
  .tile .icon img { position: absolute; left: 0; top: 0; width: 112px; height: 112px; display: block; }
  .tile .icon img { filter: drop-shadow(0 0 1px rgba(15, 23, 42, 0.35)) drop-shadow(0 10px 18px rgba(15, 23, 42, 0.45)); }
  .tile .name {
    font-size: 64px; line-height: 1.1; font-weight: 800; color: #fff;
    letter-spacing: 0.02em; font-feature-settings: "palt";
    text-shadow: 0 4px 14px rgba(15, 23, 42, 0.25);
  }
  .tile .tag {
    /* 22px / 800 so it is still ~11px bold at half size; amber-400 = the accent of 01 and the marquee */
    margin-top: 8px; font-size: 22px; line-height: 1.3; font-weight: 800;
    color: var(--amber-400); letter-spacing: 0.02em; font-feature-settings: "palt";
  }
</style>
</head>
<body>
<div class="canvas tile">
  <div class="deco"></div>
  <div class="deco2"></div>
  <div class="lockup" data-block="lockup">
    <div class="icon">
      <img src="build/icon128.png" alt="">
    </div>
    <div>
      <div class="name l">ギガひろ</div>
      <div class="tag l">いつもの日数を自動で選択</div>
    </div>
  </div>
</div>
<script src="build/geometry.js"></script>
<script src="common.js"></script>
</body>
</html>
