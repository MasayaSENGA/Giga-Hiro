<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ギガファイル便 保持期限設定</title>
  <style>
    /* グローバルリセット & モダンフォントの指定 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans JP", sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      width: 320px;
      padding: 20px;
      -webkit-font-smoothing: antialiased;
    }

    /* メインコンテナ（カード風） */
    .container {
      background: #ffffff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
    }

    /* タイトル */
    h1 {
      font-size: 1.1rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* ラベル */
    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #475569;
      margin-bottom: 8px;
    }

    /* セレクトボックスのカスタムスタイル */
    .select-wrapper {
      position: relative;
    }

    select {
      width: 100%;
      padding: 10px 14px;
      font-size: 0.95rem;
      color: #1e293b;
      background-color: #fff;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      cursor: pointer;
      appearance: none; /* デフォルトの矢印を消す */
      transition: all 0.2s ease;
    }

    select:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    /* カスタム矢印 */
    .select-wrapper::after {
      content: '';
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      border-top: 5px solid #64748b;
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      pointer-events: none;
    }

    /* 保存ボタン */
    button {
      width: 100%;
      margin-top: 16px;
      padding: 11px;
      font-size: 0.95rem;
      font-weight: 600;
      color: #ffffff;
      background-color: #3b82f6;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 2px 4px rgba(59, 130, 246, 0.2);
    }

    button:hover {
      background-color: #2563eb;
      box-shadow: 0 4px 6px rgba(37, 99, 235, 0.2);
    }

    button:active {
      transform: scale(0.98);
    }

    /* ステータスメッセージ */
    #status {
      margin-top: 12px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #10b981;
      text-align: center;
      min-height: 18px; /* ガタつき防止 */
      transition: opacity 0.3s ease;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>⚡ ギガひろの設定</h1>
    
    <label for="lifetimeSelect">デフォルトの保持期限</label>
    <div class="select-wrapper">
      <select id="lifetimeSelect">
        <option value="3">3 日</option>
        <option value="5">5 日</option>
        <option value="7">7 日</option>
        <option value="14">14 日</option>
        <option value="30">30 日</option>
        <option value="60">60 日</option>
        <option value="100">100 日</option>
      </select>
    </div>
    
    <button id="saveButton">設定を保存</button>
    <div id="status"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
